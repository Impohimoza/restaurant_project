{% extends "base.html" %}

{% block title %}Мониторинг столов{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Мониторинг столов: {{ camera.name }}</h1>

<!-- Видео-окно -->
<div class="relative bg-black rounded shadow"
     style="width: 1080px; height: 720px; overflow: hidden;">

    <!-- Видео -->
    <img src="{% url 'stream_camera' camera.id %}"
         style="
             width: 100%;
             height: 100%;
             object-fit: contain;
         ">

    <!-- Зоны столов -->
    {% for t in tables %}
    <div class="absolute border-2 border-red-500 bg-red-500/20 text-white text-xs px-1"
         style="
             left: {{ t.x1_scaled }}px;
             top: {{ t.y1_scaled }}px;
             width: {{ t.width_scaled }}px;
             height: {{ t.height_scaled }}px;
         ">
        {{ t.name }}
    </div>
    {% endfor %}
</div>

{% endblock %}
