{% extends "base.html" %}

{% block title %}Мониторинг столов{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Мониторинг столов: {{ camera.name }}</h1>

<div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
    {% for t in tables %}
    <div class="relative w-full h-64 overflow-hidden bg-black rounded shadow">
        <!-- Название стола -->
        <h3 class="absolute top-1 left-1 bg-black bg-opacity-50 text-white px-2 py-1 rounded text-sm z-10">
            {{ t.name }}
        </h3>

        <!-- Видеопоток -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden">
            <img src="{% url 'stream_camera' t.camera_id %}"
                 style="
                     position: absolute;
                     top: {{ t.neg_y1 }}px;
                     left: {{ t.neg_x1 }}px;
                     width: auto;
                     height: auto;
                     min-width: 100%;
                     min-height: 100%;
                 ">
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
