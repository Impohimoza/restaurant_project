{% extends "base.html" %}

{% block title %}Список камер{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Список камер</h1>

<div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
    {% for camera in cameras %}
    <div class="grid-cell h-48 flex flex-col justify-center items-center p-4 bg-gray-700 text-white">
        <h3 class="text-lg font-semibold">{{ camera.name }}</h3>
        <div class="mt-2">
            <a href="{% url 'edit_zones' camera.id %}" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded">Редактировать зоны</a>
            <a href="{% url 'monitor_camera' camera.id %}" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded ml-2">Мониторинг</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
